name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Check Python syntax
      run: python -m py_compile dashboard/server.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install Node dependencies
      run: npm ci

    - name: Run Node tests
      run: npm test
        
    - name: Check repository structure
      run: |
        echo "Repository cloned successfully"
        ls -la
        
    - name: Validate Markdown Files
      run: |
        test -f README.md
        test -f Handover.md
