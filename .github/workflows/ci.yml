name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Check repository structure
      run: |
        echo "Repository cloned successfully"
        ls -la
        
    - name: Validate Markdown Files
      run: |
        # Simple check to ensure key markdown files exist
        if [ ! -f "README.md" ] && [ ! -f "Handover.md" ]; then
          echo "Warning: Missing documentation files."
        fi
